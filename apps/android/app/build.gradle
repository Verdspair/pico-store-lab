plugins {
    id 'com.android.application'
}

dependencies {
    implementation project(':sdk')
}

android {
    namespace 'dev.nkanf.picostore'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.nkanf.picostore'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
